# OpenAPI 3.1 base spec — extend with your generated routes
openapi: 3.1.0
info:
  title: "{{product_name}} API"
  version: "0.1.0"
servers:
  - url: "{{base_url}}"
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200": { description: OK }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
