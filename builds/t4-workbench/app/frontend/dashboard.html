<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Ops</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2129; --ink:#e6edf3; --dim:#8b98a5; --accent:#4ade80;
          --warn:#fbbf24; --bad:#f87171; --line:#2d3742; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:14px/1.5 ui-monospace,Consolas,monospace; padding:24px; }
  h1 { font-size:18px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px; }
  .sub { color:var(--dim); margin-bottom:24px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .tile .n { font-size:28px; font-weight:700; }
  .tile .l { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:900px){ .cols { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; }
  .panel h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--dim); font-weight:400; padding:4px 8px; border-bottom:1px solid var(--line); }
  td { padding:5px 8px; border-bottom:1px solid var(--line); }
  .pill { padding:1px 8px; border-radius:99px; font-size:11px; border:1px solid var(--line); }
  .pill.running,.pill.executing { color:var(--warn); border-color:var(--warn); }
  .pill.concluded,.pill.succeeded { color:var(--accent); border-color:var(--accent); }
  .pill.failed,.pill.abandoned,.pill.cancelled { color:var(--bad); border-color:var(--bad); }
  #login { max-width:340px; margin:80px auto; }
  #login input { width:100%; margin-bottom:10px; padding:9px; background:var(--bg); color:var(--ink);
                 border:1px solid var(--line); border-radius:6px; }
  #login button { width:100%; padding:9px; background:var(--accent); color:#04310f; border:0;
                  border-radius:6px; font-weight:700; cursor:pointer; }
  .err { color:var(--bad); margin-top:8px; min-height:1.2em; }
</style>
</head>
<body>
<div id="login" hidden>
  <h1>Research Ops</h1>
  <p class="sub">sign in to your workbench</p>
  <input id="em" type="email" placeholder="email" value="">
  <input id="pw" type="password" placeholder="password">
  <button onclick="login()">Sign in / Register</button>
  <div class="err" id="lerr"></div>
</div>
<div id="dash" hidden>
  <h1>Research Ops</h1>
  <p class="sub" id="who"></p>
  <div class="tiles" id="tiles"></div>
  <div class="cols">
    <div class="panel"><h2>Experiments</h2><table id="exps"><thead>
      <tr><th>name</th><th>hypothesis</th><th>status</th></tr></thead><tbody></tbody></table></div>
    <div class="panel"><h2>Runs</h2><table id="runs"><thead>
      <tr><th>#</th><th>experiment</th><th>metrics</th><th>status</th></tr></thead><tbody></tbody></table></div>
  </div>
</div>
<script>
const api = (p, opt={}) => fetch('..' + p, {...opt, headers: {
  'Content-Type':'application/json',
  ...(localStorage.rw_tok ? {'Authorization':'Bearer '+localStorage.rw_tok, 'X-Session':localStorage.rw_tok} : {}),
  ...(opt.headers||{})}}).then(r => r.ok ? r.json() : Promise.reject(r.status));

async function login() {
  const em = document.getElementById('em').value, pw = document.getElementById('pw').value;
  try {
    await fetch('../auth/register', {method:'POST', headers:{'Content-Type':'application/json'},
                                     body: JSON.stringify({email:em,password:pw})});
    const r = await fetch('../auth/login', {method:'POST', headers:{'Content-Type':'application/json'},
                                            body: JSON.stringify({email:em,password:pw})});
    if (!r.ok) throw new Error('login failed');
    localStorage.rw_tok = (await r.json()).session;
    boot();
  } catch (e) { document.getElementById('lerr').textContent = String(e.message || e); }
}

function pill(s){ return `<span class="pill ${s}">${s}</span>`; }

async function boot() {
  let me;
  try { me = await api('/auth/me'); }
  catch { document.getElementById('login').hidden = false; return; }
  document.getElementById('login').hidden = true;
  document.getElementById('dash').hidden = false;
  document.getElementById('who').textContent = me.email;
  const [exps, runs, docs] = await Promise.all([api('/experiments'), api('/runs'), api('/research_docs')]);
  const counts = {};
  for (const e of exps) counts[e.status] = (counts[e.status]||0)+1;
  const okRuns = runs.filter(r => r.status === 'succeeded').length;
  document.getElementById('tiles').innerHTML = [
    ['experiments', exps.length], ['running', counts.running||0],
    ['concluded', counts.concluded||0], ['runs total', runs.length],
    ['runs succeeded', okRuns], ['docs', docs.length],
  ].map(([l,n]) => `<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  const en = Object.fromEntries(exps.map(e => [e.id, e.name]));
  document.querySelector('#exps tbody').innerHTML = exps.map(e =>
    `<tr><td>${e.name}</td><td>${(e.hypothesis||'').slice(0,40)}</td><td>${pill(e.status)}</td></tr>`).join('');
  document.querySelector('#runs tbody').innerHTML = runs.map(r =>
    `<tr><td>${r.id}</td><td>${en[r.experiment_id]||r.experiment_id}</td>` +
    `<td>${JSON.stringify(r.metrics||{}).slice(0,40)}</td><td>${pill(r.status)}</td></tr>`).join('');
}
boot();
</script>
</body>
</html>
