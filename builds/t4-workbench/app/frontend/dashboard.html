<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Ops</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div id="login" hidden>
  <h1>Research Ops</h1>
  <p class="sub">sign in to your workbench</p>
  <input id="em" type="email" placeholder="email" value="">
  <input id="pw" type="password" placeholder="password">
  <button id="loginbtn">Sign in / Register</button>
  <div class="err" id="lerr"></div>
</div>
<div id="dash" hidden>
  <h1>Research Ops</h1>
  <p class="sub" id="who"></p>
  <div class="tiles" id="tiles"></div>
  <div class="cols">
    <div class="panel"><h2>Experiments</h2><table id="exps"><thead>
      <tr><th>name</th><th>hypothesis</th><th>status</th></tr></thead><tbody></tbody></table></div>
    <div class="panel"><h2>Runs</h2><table id="runs"><thead>
      <tr><th>#</th><th>experiment</th><th>metrics</th><th>status</th></tr></thead><tbody></tbody></table></div>
  </div>
</div>
<script src="dashboard.js" defer></script>
</body>
</html>
