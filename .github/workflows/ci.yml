name: ci
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scrapyard
          POSTGRES_PASSWORD: scrapyard
          POSTGRES_DB: scrapyard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scrapyard -d scrapyard"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+psycopg2://scrapyard:scrapyard@localhost:5432/scrapyard
      SCRAPYARD_TEST_PG_URL: postgresql+psycopg2://scrapyard:scrapyard@localhost:5432/scrapyard
      SCRAPYARD_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Catalog integrity
        run: python tools/index_catalog.py --out /tmp/catalog-check
      - name: Module self-tests
        run: python tools/verify_part_selftests.py --jobs 4 --json /tmp/part-selftests.json
      - name: UI composition and security regressions
        run: |
          python tools/ui_lint.py
          python tests/security_regression.py
      - name: Migration drift check (real Postgres)
        run: |
          python tools/migrate.py upgrade head
          python tools/migrate.py check
      - name: Behavior contracts (real PG + Redis)
        run: python tools/verify_build.py all
      - name: Release gate - every template assembles into a working app
        run: python tools/build_matrix.py
      - name: Runtime - secure + fullstack
        run: |
          python tools/verify_runtime.py --domain healthcare --secure
          python tools/verify_runtime.py --domain sobriety --fullstack
      - name: Deploy build - assemble a template and build its image
        run: |
          python tools/assemble.py saas_app /tmp/ci_app
          docker build -t scrapyard-ci-app /tmp/ci_app
