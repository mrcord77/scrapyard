name: ci
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Verifies the library itself (per-part guarantees). No external services:
  # every part self-tests offline (in-memory SQLite, etc.).
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Catalog integrity (import + AST verify, no rubber-stamping)
        run: python tools/index_catalog.py --out /tmp/catalog-check
      - name: Module self-tests (every part, offline, falsifiable)
        run: python tools/verify_part_selftests.py --jobs 4 --json /tmp/part-selftests.json
      - name: UI composition + security regressions
        run: |
          python tools/ui_lint.py
          python tests/security_regression.py
      # Anti-blank-page gate: generate a representative app and prove its
      # frontend RENDERS in a real browser engine under the app's own CSP —
      # substantive DOM after JS, interactive elements, clean console.
      # (2026-08-16: the SPA shipped blank in every browser while every
      # HTTP-level check passed; this step is why that cannot recur.)
      - name: Frontend renders in a real browser (blocking)
        run: |
          python -m pip install selenium
          python tools/eos.py --pattern basic_saas --domain tool_library --out /tmp/fe-smoke-app
          python tools/verify_frontend.py /tmp/fe-smoke-app --smoke --out /tmp/fe-smoke-render.png
      # Keep the visible evidence: the rendered screenshot + the generated app,
      # downloadable from the run page — the proof must outlive the runner.
      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-render-evidence
          path: |
            /tmp/fe-smoke-render.png
            /tmp/fe-smoke-app
          if-no-files-found: warn
          retention-days: 30
